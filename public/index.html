<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - Coming Soon!</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="construction-card">
            <div class="icon-container">
                <i class="fas fa-hard-hat construction-icon"></i>
            </div>
            
            <h1 class="title">Under Construction</h1>
            <p class="subtitle">Something amazing is being built here</p>
            
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            
            <div class="status">
                <span class="status-dot"></span>
                <span class="status-text">Development in Progress</span>
            </div>
            
            <div class="features">
                <div class="feature">
                    <i class="fas fa-rocket"></i>
                    <span>Fast & Modern</span>
                </div>
                <div class="feature">
                    <i class="fas fa-mobile-alt"></i>
                    <span>Responsive</span>
                </div>
                <div class="feature">
                    <i class="fas fa-paint-brush"></i>
                    <span>Beautiful Design</span>
                </div>
            </div>
            
            <div class="social-links">
                <a href="#" class="social-link"><i class="fab fa-github"></i></a>
                <a href="#" class="social-link"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-link"><i class="fab fa-linkedin"></i></a>
            </div>
            
            <div class="footer">
                <p>&copy; 2025- Coming Soon!</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
